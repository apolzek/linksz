# The PWA, and the API behind the same origin.
#
# Same origin is not a preference here: a service worker only registers for its
# own origin, and the app calls /api/... with a session token. Splitting the two
# across hosts would mean CORS and a second origin for the browser to trust.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/manifest+json image/svg+xml;
    gzip_min_length 512;

    # The manifest has its own type, and the browser ignores it when it arrives
    # as something else.
    types {
        application/manifest+json  webmanifest;
    }
    include /etc/nginx/mime.types;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The service worker must always be revalidated, otherwise the browser holds
    # an old one for hours and the update never lands. Same for the shell.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # The SW caches the shell, so a short window is enough for the rest.
    location / {
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri @link;
    }

    # This address in front of a link saves it: /https://example.com/x, or
    # /example.com/x. Not a file, so it gets the app, which reads the link from
    # the address bar. Anything else that is not a file stays a 404. $uri has
    # the slashes already merged, so `https://` arrives here as `https:/`.
    location @link {
        if ($uri !~* "^/(https?:/|[a-z0-9-]+(\.[a-z0-9-]+)+(:[0-9]+)?(/|$))") {
            return 404;
        }
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files /index.html =404;
    }

    location /api/ {
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Exports of a large vault take a moment to build, and an import can be
        # megabytes of YAML.
        proxy_read_timeout 120s;
        client_max_body_size 32m;
    }
}

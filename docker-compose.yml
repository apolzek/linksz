# Two services by default:
#
#   docker compose up -d          ->  http://localhost:8080
#
# api is the backend, web is nginx with the PWA and /api proxied to it. Same
# origin, which is what the service worker and the session token need.
#
# The third one is for the phone. A PWA only installs, and a service worker
# only registers, in a secure context: https or localhost. Reaching this from a
# phone over the LAN is neither, so a TLS hop is added on demand:
#
#   1. find this machine's IP:  ip route get 1 | awk '{print $7; exit}'
#   2. BOOKMARKS_SITE=192.168.0.10 docker compose --profile tls up -d
#   3. on the phone, open http://192.168.0.10/root.crt and install the certificate
#   4. open https://192.168.0.10 and use "Add to home screen"
#
# Without step 3 the phone browser refuses the HTTPS and the PWA does not install.
#
# A local install (systemd, mise run server) runs none of this: there the
# backend serves the PWA itself on 8787.

name: bookmarks

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: bookmarks-api:local
    restart: unless-stopped
    environment:
      BOOKMARKS_HOST: 0.0.0.0
      BOOKMARKS_PORT: "8787"
      BOOKMARKS_DB: /data/bookmarks.db
      # Test account created on every boot (default: teste / teste123).
      # This stack is exposed on the local network: change the password, or turn
      # it off with BOOKMARKS_SEED=0, before leaving it running.
      BOOKMARKS_SEED_PASSWORD: ${BOOKMARKS_SEED_PASSWORD:-teste123}
    volumes:
      - bookmarks-data:/data
    # No ports: the web container is what talks to it. To reach the API
    # directly (debugging), uncomment:
    # ports:
    #   - "8787:8787"
    networks:
      - bookmarks

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: bookmarks-web:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Published because this is the front door without the TLS hop. With the
      # tls profile on, the proxy is what you open and this stays reachable for
      # debugging.
      - "${BOOKMARKS_PORT:-8080}:80"
    networks:
      - bookmarks

  # Only with --profile tls: it exists for the phone, and nothing else needs it.
  proxy:
    profiles: [tls]
    build: ./proxy          # the Caddyfile is baked in, see proxy/Dockerfile
    image: bookmarks-proxy:local
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      # The hostname or IP you use to reach it. The certificate is issued for it.
      BOOKMARKS_SITE: ${BOOKMARKS_SITE:-bookmarks.local}
    ports:
      - "${BOOKMARKS_HTTP_PORT:-80}:80"
      - "${BOOKMARKS_HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data       # holds the CA: deleting it means recertifying everything
      - caddy-config:/config
    networks:
      - bookmarks

volumes:
  bookmarks-data:
  caddy-data:
  caddy-config:

networks:
  bookmarks:
    driver: bridge

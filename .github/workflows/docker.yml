name: Docker image

# The push step is opt in on purpose: run the workflow with push set to false
# to check the credentials, the build and the scan without publishing anything.
on:
  workflow_dispatch:
    inputs:
      push:
        description: Publish the image
        type: boolean
        default: false
  push:
    branches: [master]

env:
  # Same shape as the other images in the account, nochaos/delineax-api
  NAMESPACE: nochaos
  # The github registry mirrors the same image under the organization
  GHCR: ghcr.io/${{ github.repository_owner }}

jobs:
  # The image is only worth building if the suite that guards it still passes
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24   # node:sqlite, which the api is built on
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The suite has no dependencies: node builtins on one side, the standard
      # library on the other. PyYAML is the exception, and it is there to prove
      # that a file this project writes opens in somebody else's parser.
      - name: Install PyYAML for the interop test
        run: pip install pyyaml

      # api, web search engine, its Python twin and the desktop bar, in one go
      - name: Run the suite
        run: bash tests/run.sh

  image:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          # Per-image tags ask when each part last changed, and the default
          # one-commit clone cannot answer that.
          fetch-depth: 0

      - name: Collect the build stamp
        id: stamp
        run: |
          set -eu
          # One tag per image, from the last commit that touched what goes into
          # it: date and the first five characters of that commit. A release
          # that only changes the frontend leaves the api and the proxy on the
          # tag they already had, which is what versioning them apart means.
          #
          # The api carries the search engine from web/, so it moves with it.
          # Falls back to the head commit: a path with no history of its own
          # (a fresh checkout of a new directory) still gets a real tag.
          tag_for() {
            date=$(git log -1 --format=%cs -- "$@")
            sha=$(git log -1 --format=%h --abbrev=5 -- "$@")
            if [ -z "$sha" ]; then
              date=$(git log -1 --format=%cs)
              sha=$(git log -1 --format=%h --abbrev=5)
            fi
            echo "$date-$sha"
          }
          {
            echo "api=$(tag_for api web/search.js)"
            echo "web=$(tag_for web)"
            echo "proxy=$(tag_for proxy)"
            echo "sha=$(git rev-parse --short HEAD)"
            echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Three images: the api, the PWA behind nginx, and the TLS hop a phone
      # needs. The api and the web share a build context (the repository root)
      # because the search engine is one file used by both sides.
      #
      # Built into the local daemon first, so trivy scans the exact bits that
      # will be pushed later, not a rebuild of them
      - name: Build the api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api/Dockerfile
          load: true
          pull: true   # always start from the freshest base image
          tags: bookmarks-api:candidate
          # The stamp reaches the UI through /api/health, next to the sync light
          build-args: |
            BOOKMARKS_COMMIT=${{ steps.stamp.outputs.sha }}
            BOOKMARKS_DEPLOYED_AT=${{ steps.stamp.outputs.time }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./web/Dockerfile
          load: true
          pull: true
          tags: bookmarks-web:candidate
          build-args: |
            BOOKMARKS_COMMIT=${{ steps.stamp.outputs.sha }}
            BOOKMARKS_DEPLOYED_AT=${{ steps.stamp.outputs.time }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build the proxy image
        uses: docker/build-push-action@v6
        with:
          context: ./proxy
          load: true
          pull: true
          tags: bookmarks-proxy:candidate
          build-args: |
            BOOKMARKS_COMMIT=${{ steps.stamp.outputs.sha }}
            BOOKMARKS_DEPLOYED_AT=${{ steps.stamp.outputs.time }}
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,mode=max,scope=proxy

      - name: Scan the api image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: bookmarks-api:candidate
          format: table
          severity: CRITICAL,HIGH
          scanners: vuln,secret
          # Nothing to do about a vulnerability with no fix available yet, so
          # it is reported by the next step instead of blocking the release
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan the web image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: bookmarks-web:candidate
          format: table
          severity: CRITICAL,HIGH
          scanners: vuln,secret
          ignore-unfixed: true
          exit-code: '1'

      # The proxy is caddy's own binary in caddy's own image. What we control
      # is the OS layer and what the build puts in the image, and that half
      # blocks: it is how the CA private key that `caddy validate` used to leave
      # behind was caught.
      - name: Scan the proxy image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: bookmarks-proxy:candidate
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln,secret
          pkg-types: os
          exit-code: '1'

      # The other half is the Go standard library caddy was compiled against.
      # Only an upstream rebuild fixes those, and holding our releases for it
      # protects nobody, so they are reported and read, not enforced.
      - name: Report what upstream still has to fix in the proxy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: bookmarks-proxy:candidate
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          pkg-types: library
          exit-code: '0'

      # Logging in is not publishing: it runs on every green scan so a broken or
      # expired credential shows up here, on an ordinary push, instead of the
      # day someone actually needs to release.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # No secret to manage here: the token the runner already carries is
      # enough to write packages owned by this repository
      - name: Log in to the github registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The only step that actually publishes, and the only one still gated
      - name: Publish the three images to both registries
        if: ${{ inputs.push == true }}
        env:
          TAG_API: ${{ steps.stamp.outputs.api }}
          TAG_WEB: ${{ steps.stamp.outputs.web }}
          TAG_PROXY: ${{ steps.stamp.outputs.proxy }}
        run: |
          set -eu
          publish() {
            image=$1 tag=$2
            for target in "$NAMESPACE/bookmarks-$image" "$GHCR/bookmarks-$image"; do
              docker tag "bookmarks-$image:candidate" "$target:$tag"
              docker tag "bookmarks-$image:candidate" "$target:latest"
              docker push "$target:$tag"
              docker push "$target:latest"
            done
          }
          publish api "$TAG_API"
          publish web "$TAG_WEB"
          publish proxy "$TAG_PROXY"

      - name: Say what happened
        env:
          TAG_API: ${{ steps.stamp.outputs.api }}
          TAG_WEB: ${{ steps.stamp.outputs.web }}
          TAG_PROXY: ${{ steps.stamp.outputs.proxy }}
        run: |
          if [ "${{ inputs.push }}" = "true" ]; then
            echo "Scanned and published to $NAMESPACE and $GHCR:"
          else
            echo "Dry run: the three images built, scanned clean and both"
            echo "registries accepted the credentials. Nothing was pushed."
            echo "The tags it would have used:"
          fi
          echo "  bookmarks-api    $TAG_API"
          echo "  bookmarks-web    $TAG_WEB"
          echo "  bookmarks-proxy  $TAG_PROXY"

name: Docker image

# The push step is opt in on purpose: run the workflow with push set to false
# to check the credentials, the build and the scan without publishing anything.
on:
  workflow_dispatch:
    inputs:
      push:
        description: Publish the image
        type: boolean
        default: false
  push:
    branches: [master]

env:
  GHCR: ghcr.io/${{ github.repository_owner }}

jobs:
  # The image is only worth building if the suite that guards it still passes
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24   # node:sqlite, which the api is built on

      # Nothing to install: the suite is node built-ins from end to end.
      - name: Run the suite
        run: bash tests/run.sh

  image:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          # Per-image tags ask when each part last changed, and the default
          # one-commit clone cannot answer that.
          fetch-depth: 0

      - name: Collect the build stamp
        id: stamp
        run: |
          set -eu
          # One tag per image, from the last commit that touched what goes into
          # it: date and the first five characters of that commit. A release
          # that only changes the frontend leaves the api on the tag it already
          # had, which is what versioning them apart means.
          #
          # The api carries the search engine from web/, so it moves with it.
          # Falls back to the head commit: a path with no history of its own
          # (a fresh checkout of a new directory) still gets a real tag.
          tag_for() {
            date=$(git log -1 --format=%cs -- "$@")
            sha=$(git log -1 --format=%h --abbrev=5 -- "$@")
            if [ -z "$sha" ]; then
              date=$(git log -1 --format=%cs)
              sha=$(git log -1 --format=%h --abbrev=5)
            fi
            echo "$date-$sha"
          }
          {
            echo "api=$(tag_for api web/search.js)"
            echo "web=$(tag_for web)"
            echo "sha=$(git rev-parse --short HEAD)"
            echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Two images: the api, and the PWA behind nginx. They share a build
      # context (the repository root) because the search engine is one file
      # used by both sides.
      #
      # Built into the local daemon first, so trivy scans the exact bits that
      # will be pushed later, not a rebuild of them
      - name: Build the api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api/Dockerfile
          load: true
          pull: true   # always start from the freshest base image
          tags: linksz-api:candidate
          # The stamp reaches the UI through /api/health, next to the sync light
          build-args: |
            LINKSZ_COMMIT=${{ steps.stamp.outputs.sha }}
            LINKSZ_DEPLOYED_AT=${{ steps.stamp.outputs.time }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./web/Dockerfile
          load: true
          pull: true
          tags: linksz-web:candidate
          build-args: |
            LINKSZ_COMMIT=${{ steps.stamp.outputs.sha }}
            LINKSZ_DEPLOYED_AT=${{ steps.stamp.outputs.time }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Scan the api image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: linksz-api:candidate
          format: table
          severity: CRITICAL,HIGH
          scanners: vuln,secret
          # Nothing to do about a vulnerability with no fix available yet, so
          # it is reported by the next step instead of blocking the release
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan the web image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: linksz-web:candidate
          format: table
          severity: CRITICAL,HIGH
          scanners: vuln,secret
          ignore-unfixed: true
          exit-code: '1'

      # No secret to manage: the runner's token can write this repository's packages
      - name: Log in to the github registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The only step that actually publishes, and the only one still gated
      - name: Publish both images
        if: ${{ inputs.push == true }}
        env:
          TAG_API: ${{ steps.stamp.outputs.api }}
          TAG_WEB: ${{ steps.stamp.outputs.web }}
        run: |
          set -eu
          publish() {
            image=$1 tag=$2
            target="$GHCR/linksz-$image"
            docker tag "linksz-$image:candidate" "$target:$tag"
            docker tag "linksz-$image:candidate" "$target:latest"
            docker push "$target:$tag"
            docker push "$target:latest"
          }
          publish api "$TAG_API"
          publish web "$TAG_WEB"

      - name: Say what happened
        env:
          TAG_API: ${{ steps.stamp.outputs.api }}
          TAG_WEB: ${{ steps.stamp.outputs.web }}
        run: |
          if [ "${{ inputs.push }}" = "true" ]; then
            echo "Scanned and published to $GHCR:"
          else
            echo "Dry run: both images built, scanned clean and the registry"
            echo "accepted the credentials. Nothing was pushed."
            echo "The tags it would have used:"
          fi
          echo "  linksz-api  $TAG_API"
          echo "  linksz-web  $TAG_WEB"

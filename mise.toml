# Node is here for the test suite: the app itself runs in containers.
[tools]
node = "24"

[tasks.up]
description = "Starts the stack (api + web) on http://localhost:8080"
run = "docker compose up -d --build"

[tasks.down]
description = "Stops the stack"
run = "docker compose down"

[tasks.logs]
description = "Follows the logs of both containers"
run = "docker compose logs -f"

[tasks.test]
description = "Runs the test suite"
run = "bash tests/run.sh"

[tasks.test-all]
description = "Full suite: node, the browser and the Docker stack"
run = "bash tests/run.sh --all"

[tools]
node = "24"
python = "3.12"

[env]
VAULTMARKS_PORT = "8787"

[tasks.server]
description = "Starts the backend + web UI (http://localhost:8787)"
run = "node server/server.js"

[tasks.bar]
description = "Opens the desktop search bar"
run = "python3 desktop/vaultmarks_bar.py"

[tasks.install]
description = "Installs on the desktop (detects Linux or macOS)"
run = "bash desktop/install.sh"

[tasks.test]
description = "Runs the test suite"
run = "bash tests/run.sh"

[tasks.test-all]
description = "Full suite, including the Docker stack"
run = "bash tests/run.sh --compose"

[tasks.up]
description = "Starts the Docker stack (backend + Caddy with TLS) for the phone"
run = "docker compose up -d --build"

[tasks.down]
description = "Stops the Docker stack"
run = "docker compose down"
